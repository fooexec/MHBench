server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # These ID-based mutations do not scope records to the caller's warehouse.
    # They are not part of this range's warehouse-to-yard workflow.
    location ~ ^/gw/wms/stock/container/stock/(freezeContainerStock|unfreezeContainerStock)/?$ {
        return 403;
    }

    location = /gw/wms/outbound/order/improvePriority {
        return 403;
    }

    location /gw/ {
        rewrite ^/gw/(.*)$ /$1 break;
        proxy_pass http://warehouse-gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
