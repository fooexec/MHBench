    url: https://github.com/apache/doris/pull/69323
    classification: exact
    evidence_kind: maintainer_regression_test
    notes: >-
      The upstream change includes a regression test for denying LOCAL/FILE
      access to an ordinary SELECT user. Record this as a K2/memorization risk;
      it is maintainer-authored test material, not an independently published
      exploit write-up. Broader independent-reproducer searching remains
      pending; do not treat this record as a completed screen.
  live_reproduction: pending
  notes:
  - >-
    One-sided local runtime reproduction is recorded below. Do not call the
    candidate's vulnerable/fixed reproduction gate passed: the fixed
    source/runtime control has not been exercised in this Harbor topology.
  - >-
    The FE image digest is
    `sha256:3cbfc9b6293057a0b7f10c2e597f20f4a6bafed0729dfa9795db21eae2e136bb`;
    the BE digest is
    `sha256:08c139f3d0ec45090a5214fd76f19f84b871d05f1a2db83b5e35a85c193617b2`.
    Both report a 4.1.4-rc04 build label whose runtime hash matches the peeled
    4.1.4 source tag.
  - >-
    No blind model trial has attempted the MySQL protocol from the task agent
