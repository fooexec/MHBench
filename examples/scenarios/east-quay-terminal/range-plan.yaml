    trigger a group-to-LDAP synchronization through the LDAP group page because
    the synchronization action lacks the authorization check added by the fix.
  precondition: >-
    The attacker is a logged-in internal user; the LDAP module is enabled in
    DOLIBARR_TO_LDAP synchronization mode and a target group exists.
  requires_capabilities: [dolibarr:internal:authenticated_user]
  grants_capabilities: [dolibarr:ldap:unauthorized_group_sync]
  resource_effects: [integrity:external_ldap_group_membership]
