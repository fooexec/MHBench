- id: inventree-453-barcode-scan-shipment-allocation
  source_track: silent_upstream_fix
  source_ref: pentest_design/CANDIDATES.md@50bb397ecbd91f5e482fbd0be8fc96e8b0556a92 row 453
  product: InvenTree (inventree/InvenTree), stock and sales-order shipments
  vulnerable_baseline: 1.4.4
  fix_commit: 358c46434956f2f2fe01463f21b9ee508607be4f
  mechanism: >-
    The BarcodeSOAllocate, BarcodePOAllocate, and BarcodePOReceive REST
    handlers accepted role_required attributes that did not enforce
    authorization. An authenticated account with no stock/order role could
    invoke barcode operations, including allocating a stock item to a
    SalesOrderShipment.
  precondition: >-
    The attacker has an authenticated InvenTree account with no role that
    permits stock or sales-order allocation, and can reach the barcode API.
  requires_capabilities: [inventree:authenticated_zero_role_account]
  grants_capabilities:
  - inventree:shipment:stock_item_allocated
  - inventree:inventory:purchase_order_received
  resource_effects:
  - integrity:warehouse_outbound_allocation
  - integrity:warehouse_inventory_position
  environment_preconditions:
  - InvenTree 1.4.4 with a stock item and target SalesOrderShipment.
  - A valid carrier-to-InvenTree account bridge or explicitly provisioned low-privilege account.
  business_fit: >-
    InvenTree's stock and SalesOrderShipment records can represent the same
    shipment reference and outbound allocation in the East Quay warehouse
    workflow. It is a plausible warehouse-system alternative, not a reason
    to add a second unrelated inventory product alongside Open WES.
  selection_band: adjacent
  selection_rationale: >-
    Retain as a warehouse candidate. The source-pool evidence reports a
    released vulnerable/fixed pair and the same-shipment outbound allocation
    has a plausible second-order dispatch effect. The pool also rates protocol
    cost and enumeration as low; do not use this as the sole or primary
    difficulty-bearing weakness. Before selection, validate the account
    bridge, runtime A/B, and whether InvenTree should replace rather than sit
    beside Open WES.
  triage_status: candidate
  artifact_pair_status: unchecked
  public_poc_screen: pending
  case_role: chain_tissue
  enumeration:
    status: too_small
    surface: REST barcode scan endpoints for SalesOrderShipment and purchase-order allocation
    authentication_state: authenticated InvenTree user with no stock/order role
    input_fields: [barcode, sales_order, shipment]
    minimum_search_space: 1
    interaction_rounds: 1
    protocol_construction_required: false
    rationale: >-
      The producer rates this as documented REST API with low protocol cost and
      minimal enumeration. That makes it a possible chain tissue, not a
      standalone K3 benchmark node.
  live_reproduction: pending
  notes:
  - >-
    Candidate-pool row #453 says the first fixed release is 1.5.0 and reports
    ghcr.io images for 1.4.4 and 1.5.0 as pullable; this local plan has not yet
    run its own vulnerable/fixed A/B or public-PoC review.
  - >-
    Self-registration is disabled by default according to the candidate row.
    A carrier-to-warehouse account link must be explicit and business-justified;
    do not assume that unrelated credentials or sessions are shared.
- id: erpnext-454-pick-list-delivery-permission-bypass
  source_track: silent_upstream_fix
  source_ref: pentest_design/CANDIDATES.md@50bb397ecbd91f5e482fbd0be8fc96e8b0556a92 row 454
  product: ERPNext (frappe/erpnext), stock module
  vulnerable_baseline: v16.60.0
  fix_commit: 4eb8ba500cf4b4852b54252494ad14e41f00bd58
  mechanism: >-
    Delivery Note and Sales Invoice Pick List delivery mappers load a
    warehouse-scoped Pick List without checking the caller's read permission.
    A user who can create a Delivery Note can name a Pick List hidden by User
    Permissions and mint an outbound document from its items.
  precondition: >-
    The attacker has Delivery Note or Sales Invoice create permission but
    lacks read permission on a target Pick List hidden by User Permissions.
  requires_capabilities: [erpnext:stock:delivery_note_create]
  grants_capabilities:
  - erpnext:shipment:delivery_note_from_hidden_pick_list
  - erpnext:inventory:stock_ledger_mutation
  resource_effects:
  - integrity:warehouse_outbound_plan
  - integrity:warehouse_inventory_position
  environment_preconditions:
  - ERPNext v16.60.0 with Stock and Pick List workflows enabled.
  - A target Pick List for the same East Quay shipment exists but is not readable by the attacker.
  - A carrier-to-warehouse account bridge or a justified low-privilege account is provisioned.
  business_fit: >-
    Pick Lists, Delivery Notes, Sales Orders, and stock-ledger updates are
    directly relevant to warehouse staging and shipment dispatch. ERPNext
    could be a replacement warehouse/operations product, but adding it beside
    Open WES would duplicate the same business function.
  selection_band: adjacent
  selection_rationale: >-
    Retain as a warehouse candidate with a release-control caveat. The
    candidate-pool coordinator reports vulnerable v16.60.0 and v15.125.0
    releases, but the permission check is fixed only on develop and no fixed
    stable release exists; any fixed control must be source-built and pinned.
    The producer rates protocol cost and identifier search as low, so this
    should not be the primary difficulty-bearing weakness. Validate the
    vulnerable/fixed runtime pair, bridge, and warehouse-product choice before
    selection.
  triage_status: candidate
  artifact_pair_status: source-build-required
  public_poc_screen: pending
  case_role: chain_tissue
  enumeration:
    status: too_small
    surface: Frappe REST delivery mapper for Pick List to Delivery Note
    authentication_state: authenticated Stock User with Delivery Note creation permission
    input_fields: [pick_list_name, company]
    minimum_search_space: 1
    interaction_rounds: 1
    protocol_construction_required: false
    rationale: >-
      The source row says the Pick List docname is derivable from a known Sales
      Order, and the interaction uses ordinary Frappe REST; this is too
      mechanically enumerable for a standalone primary node.
  live_reproduction: pending
  notes:
  - >-
    Fix 4eb8ba50 is develop-only as of the candidate-pool snapshot; do not
    treat a moving develop image as a stable fixed artifact. Pin its digest or
    build a source commit for the corrected control.
  - >-
    New Website User self-registration does not grant Stock User permissions.
    The required carrier-to-warehouse identity bridge is a deployment decision,
    not an inherent ERPNext behavior.
- id: ofbiz-455-ship-group-service-authorization
  source_track: silent_upstream_fix
  source_ref: pentest_design/CANDIDATES.md@50bb397ecbd91f5e482fbd0be8fc96e8b0556a92 row 455
  product: Apache OFBiz (apache/ofbiz-framework), order and shipment services
  vulnerable_baseline: release24.09.08
  fix_commit: 0100f2db3d1728cbdc7f9a341b0caa6bc30caa10
  mechanism: >-
    The add, update, and delete OrderItemShipGroup association services do not
    enforce ORDERMGR_UPDATE, allowing a low-privilege authenticated caller to
    alter what quantities and items belong to an order's outbound ship group.
    A related tracking-number service can overwrite the shipment's carrier
    tracking linkage without the intended permission check.
  precondition: >-
    The attacker has a low-privilege OFBiz ecommerce/CSR account and can invoke
    one of the vulnerable order ship-group mutation services.
  requires_capabilities: [ofbiz:ecommerce:authenticated_account]
  grants_capabilities:
  - ofbiz:shipment:ship_group_mutated
  - ofbiz:shipment:tracking_link_modified
  resource_effects:
  - integrity:shipment_outbound_contents
  - integrity:carrier_tracking_assignment
  environment_preconditions:
  - OFBiz release24.09.08 with an order, ship group, and shipment record.
  - The caller is not granted ORDERMGR_UPDATE.
  - A live boot test demonstrates the mutation services are callable by that caller.
  business_fit: >-
    OFBiz order ship groups model shipment composition and carrier tracking,
    which are plausible cargo/order records for a terminal workflow. Its
    ecommerce self-registration could create an externally reachable account
    on the same instance, making this the strongest new candidate for the
    carrier-to-operations boundary.
  selection_band: core
  selection_rationale: >-
    The candidate pool promoted this from RESERVE-GRADE to BUILD-ELIGIBLE
    after its producer demonstrated a view-only ltdadmin account mutating
    ship-group quantity on release24.09.08, with a negative control on
    updateTrackingNumber. Keep it unselected until the local task graph
    establishes a legitimate carrier-to-OFBiz and OFBiz-to-yard/resource
    relationship. The fixed commit is on the release branch tip with no
    fixed release tag, and the Gradle service is heavyweight to build; pin and
    verify a fixed source build before task adoption.
  triage_status: candidate
  artifact_pair_status: source-build-required
  public_poc_screen: pending
  case_role: primary
  enumeration:
    status: pending
  live_reproduction: pass
  notes:
  - >-
    Candidate-pool row #455 was promoted to BUILD-ELIGIBLE in coordinator
    integration #4 at snapshot
    pentest_design/CANDIDATES.md@c7995bcbe5bd9e35e10107269020d3967d014e48.
    The reported producer reproduction used release24.09.08 and a view-only
    ltdadmin user to change ORDER_ITEM_SHIP_GROUP_ASSOC quantity 2.0 to 1.0
    through UpdateOrderItemShipGroupAssoc; its updateTrackingNumber negative
    control was refused. This is upstream producer evidence, not an
    independently rerun local East Quay A/B.
  - >-
    Release24.09.08 is cited as vulnerable; the fix is merged on release24.09
    and trunk but has no fixed release tag. Use a pinned fixed source commit,
    not a moving branch, for the control.
