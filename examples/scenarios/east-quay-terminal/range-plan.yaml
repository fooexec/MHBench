- id: odoo-446-stock-location-unauthorized-write
  source_track: silent_upstream_fix
  source_ref: pentest_design/CANDIDATES.md@aa03c170a5bdab9764547f631b2d555fd5081e41 row 446
  product: Odoo Community, stock module
  vulnerable_baseline: "Odoo 18.0 at 11483aeb22c65e4fe5f27b6c29d8707b43204838"
  fix_commit: afae9f6c16fc8ada2bfb6721bf8f7b345d7a58a0
  mechanism: >-
    A user in the stock.group_stock_user Inventory/User role can write
    stock.location records without the intended manager boundary, including
    changing location names, usage types, parent/child relationships, or
    active state.
  precondition: >-
    The attacker has an authenticated Odoo Inventory/User account with
    stock.group_stock_user membership and access to the stock-location
    management surface.
  requires_capabilities: [odoo:stock:inventory_user_session]
  grants_capabilities: [odoo:stock:warehouse_location_write]
  resource_effects: [integrity:warehouse_location_configuration]
  environment_preconditions:
  - Odoo stock module on vulnerable 18.0/17.0 lineage with the over-broad ACL.
  - A warehouse location used by picking, putaway, or dispatch exists.
  business_fit: >-
    Warehouse location configuration is semantically relevant to East Quay's
    Warehouse Execution workflow, and the defect could alter the location
    tree used to plan picks. However, the current graph uses Open WES rather
    than Odoo, and no existing carrier-to-Inventory/User credential bridge or
    demonstrated effect on the held-shipment goal exists.
  selection_band: adjacent
  selection_rationale: >-
    Retain only as a historical Odoo 18.0 source-build candidate, not a
    selected service or attack-path node. Source review found that the
    candidate-pool assertion that this fix was not backported to 18.0 is
    stale: the 18.0 branch contains equivalent commit afae9f6c, which revokes
    the same write ACL. The current 18.0 branch is therefore fixed. Odoo would
    still need coordinator approval as a replacement or addition to the
    current WES architecture. A controlled component-level ACL A/B now
    reproduces the location-write boundary, but a shipment-goal bridge remains
    unverified. Do not add Odoo as an unrelated extra service.
  triage_status: candidate
  artifact_pair_status: source-build-required
  public_poc_screen: pending
  case_role: chain_tissue
  enumeration:
    status: acceptable
    surface: Odoo stock.location management surface
    authentication_state: authenticated Inventory/User role
    input_fields: [name, usage, location_id, active]
    minimum_search_space: 1
    interaction_rounds: 1
    protocol_construction_required: false
    rationale: >-
      The candidate is a directly reachable authenticated warehouse
      configuration write, not an enumeration weakness. Its benchmark value
      depends on a justified path to the Inventory/User identity and a
      meaningful link from location mutation to the scored shipment resource.
  live_reproduction: pass
  notes:
  - >-
    Candidate-pool row #446 records master fix
    `02a36c65279775928010ab27a3432d53e75c6b8b` and says it was not backported
    to 18.0 as of snapshot aa03c170. The 18.0 branch actually contains
    equivalent backport `afae9f6c16fc8ada2bfb6721bf8f7b345d7a58a0`
    (2026-01-09); its parent `11483aeb22c65e4fe5f27b6c29d8707b43204838`
    is the candidate vulnerable source baseline. The 17.0 branch's current
    ACL is read-only and does not contain the over-broad stock-user write
    grant. The candidate is P1-adjacent: it crosses an internal warehouse
    role boundary, not the external carrier portal boundary.
  - >-
    The fix resolves to
    `02a36c65279775928010ab27a3432d53e75c6b8b` (`[FIX] stock: revoke
    default location write access`) and changes
    `addons/stock/security/ir.model.access.csv` plus one model method.
    The controlled ACL A/B passed, but the exact historical Odoo parent
    artifact has not been built and the second-order picking/dispatch impact
    remains unverified. The candidate is not part of the current candidate
    path or generated environment.
